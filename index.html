<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khoa Le Duy — iOS Apps</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: #1c1c1e;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: #6b6b70; margin: 0 0 2.5rem; }
  .app {
    border: 1px solid #e3e3e6;
    border-radius: 12px;
    padding: 1.25rem;
  }
  .app h2 { font-size: 1.125rem; margin: 0 0 .35rem; }
  .app p { margin: 0 0 1rem; color: #6b6b70; }
  .links a {
    display: inline-block;
    margin: 0 1rem .35rem 0;
    color: #0a63d8;
    text-decoration: none;
  }
  .links a:hover { text-decoration: underline; }
  footer { margin-top: 2.5rem; color: #8a8a8f; font-size: .875rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f2f2f7; }
    .sub, .app p { color: #98989d; }
    .app { border-color: #2c2c2e; }
    .links a { color: #4d9bff; }
    footer { color: #7c7c80; }
  }
</style>
</head>
<body>
<main>
  <h1>Khoa Le Duy</h1>
  <p class="sub">iOS app developer</p>

  <section class="app">
    <h2>PDF Converter – Image to PDF</h2>
    <p>Convert images to PDF, merge, split and organise documents on iPhone and iPad.</p>
    <div class="links">
      <a href="https://apps.apple.com/us/app/pdf-converter-image-to-pdf/id6760351341">View on the App Store</a>
      <a href="https://khoald2302.github.io/policy_PDF_Converter/">Privacy Policy</a>
    </div>
  </section>

  <footer>© Khoa Le Duy</footer>
</main>
</body>
</html>
